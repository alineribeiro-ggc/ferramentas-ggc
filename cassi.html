<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissões CASSI — Global Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#F7F8FB;--card:#FFFFFF;--border:#E8EAEE;--border2:#DFE2E7;--ink:#0F172A;--sub:#64748B;--mut:#94A3B8;
 --brand:#E41F1B;--brand-d:#C31A16;--brand-weak:#FDECEC;--ring:rgba(228,31,27,.16);
 --green:#16A34A;--greenbg:#F0FDF4;--blue:#2563EB;--bluebg:#EFF6FF;--amber:#D97706;--amberbg:#FFFBEB;
 --red:#DC2626;--redbg:#FEF2F2;--violet:#7C3AED;--violetbg:#F5F3FF;--slate:#64748B;--slatebg:#F1F5F9;
 --sh:0 1px 2px rgba(16,24,40,.05);--sh2:0 4px 14px rgba(16,24,40,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:230px;flex:none;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.brand .nm{font-weight:700;font-size:14px;color:var(--ink);line-height:1.15}
.brand .nm span{display:block;font-weight:500;font-size:11.5px;color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:500;font-size:13.5px;padding:9px 11px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
.nav button svg{width:18px;height:18px;flex:none;stroke-width:2}
.nav button:hover{background:var(--slatebg);color:var(--ink)}
.nav button.on{background:var(--brand-weak);color:var(--brand);font-weight:600}
.side .grow{flex:1}
.side-foot{border-top:1px solid var(--border);padding-top:12px;font-size:11px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;margin-bottom:8px}
.pill.live{background:var(--greenbg);color:var(--green)}.pill.paused{background:var(--amberbg);color:var(--amber)}
.pill .dot{width:7px;height:7px;border-radius:50%}.pill.live .dot{background:#22C55E}.pill.paused .dot{background:#F59E0B}
/* Main */
.main{flex:1;min-width:0;padding:22px 28px 40px}
.hd{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hd h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.3px}
.hd .sub{margin:2px 0 0;color:var(--sub);font-size:13px}
.hd .sp{flex:1}
.hd .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border2);border-radius:9px;padding:0 10px;height:38px}
.field svg{width:15px;height:15px;color:var(--mut);flex:none}
.field input,.field select{border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);min-width:150px}
select.sel{height:38px;border:1px solid var(--border2);border-radius:9px;background:#fff;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);outline:0}
select:focus,input:focus,.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn svg{width:16px;height:16px}.btn:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--sub);border-color:var(--border2)}.btn.ghost:hover{background:var(--slatebg);color:var(--ink)}
.ro{font-size:11.5px;color:var(--mut)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s}
.kpi:hover,.fst:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--border2)}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kpi .ic svg{width:16px;height:16px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
.kpi .l{font-size:12.5px;color:var(--sub);margin-top:5px}
/* Funil */
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.fst{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--sh);position:relative;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s}
.banner{display:flex;align-items:center;gap:10px;background:var(--brand-weak);border:1px solid #F6CFCE;color:var(--brand-d);border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:13px}
.banner b{color:var(--ink)}.banner .sp{flex:1}
.banner button{border:1px solid #F0C4C2;background:#fff;color:var(--brand-d);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.banner button:hover{background:#FFF5F5}
.fst .n{font-size:22px;font-weight:700;letter-spacing:-.4px}.fst .t{font-size:11.5px;color:var(--sub);margin-top:2px}
.fst .bar{height:3px;border-radius:3px;background:var(--brand);margin-top:9px;opacity:.85}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.panel h4{margin:0 0 10px;font-size:13px;color:var(--ink);font-weight:600}
.cb{position:relative;height:210px}
/* Painel de monitoramento */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.qhead h4{margin:0;font-size:13px;font-weight:600}
.qhead .c{font-size:11px;font-weight:600;color:var(--sub);background:var(--slatebg);border-radius:20px;padding:2px 9px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #F1F3F6;cursor:pointer}
.qrow:hover{background:#FBFCFE}
.qrow .qn{flex:1;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qu{font-size:11.5px;color:var(--sub);white-space:nowrap}
.qrow .qd{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.unigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.unicard{border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.unicard .un{font-weight:600;font-size:13px;margin-bottom:8px}
.unicard .r{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:2px 0}
.unicard .r b{color:var(--ink);font-weight:700}
.morecol{text-align:center;font-size:11.5px;font-weight:600;color:var(--brand);cursor:pointer;padding:8px;background:#fff;border:1px dashed var(--border2);border-radius:9px}
.morecol:hover{background:var(--brand-weak)}
/* Quadro */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 214px;width:214px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.colh .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.colh .t .sq{width:8px;height:8px;border-radius:3px}
.colh .c{font-size:11px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
.collist{display:flex;flex-direction:column;gap:9px;background:var(--slatebg);border-radius:13px;padding:10px;min-height:70px}
.pc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 12px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s,transform .15s;border-left:3px solid var(--acc)}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.pc .nm{font-weight:600;font-size:13px;line-height:1.3;color:var(--ink)}
.pc .nm .mtag{font-size:9.5px;font-weight:600;color:var(--blue);background:var(--bluebg);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.mt{display:flex;align-items:center;margin-top:11px}
.mt .n{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #CBD2DA;flex:none}
.mt .n.on{background:var(--green);border-color:var(--green)}.mt .n.stop{background:var(--red);border-color:var(--red)}
.mt .l{flex:1;height:2px;background:#DFE3E8}.mt .l.on{background:var(--green)}
.emptycol{color:#AEB6C0;font-size:11.5px;text-align:center;padding:10px 0}
/* Lista */
.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid #F1F3F6;white-space:nowrap;font-size:13px}
tbody tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#FBFCFE}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:20px}
.badge .d{width:7px;height:7px;border-radius:50%}
/* Drawer + modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.ov.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(430px,95vw);background:#fff;box-shadow:-10px 0 34px rgba(15,23,42,.16);transform:translateX(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;overflow-y:auto}
.dr.open{transform:none}
.dh{padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.dh .x{position:absolute;top:16px;right:18px;border:0;background:var(--slatebg);width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:15px}
.dh h2{margin:0;font-size:18px;font-weight:700;padding-right:34px;letter-spacing:-.3px}
.db{padding:18px 22px}
.tl{position:relative}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}.tl .st:last-child{padding-bottom:0}
.tl .st .ln{position:absolute;left:8px;top:17px;bottom:-1px;width:2px;background:#E2E6EB}.tl .st.on .ln{background:var(--green)}
.tl .st .c{width:17px;height:17px;border-radius:50%;border:3px solid #E2E6EB;background:#fff;flex:none;z-index:1}
.tl .st.on .c{background:var(--green);border-color:var(--green)}.tl .st.stop .c{background:var(--red);border-color:var(--red)}
.tl .st .lab{font-weight:600;font-size:13px}.tl .st .dt{font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;font-size:13px;margin-top:18px}.kv .k{color:var(--sub)}
.note{background:var(--amberbg);border:1px solid #FCE9BE;color:#8A5A00;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:16px}
.editbox{margin-top:18px;border-top:1px solid var(--border);padding-top:16px}
.editbox label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:500}
.editbox select,.editbox textarea{width:100%;border:1px solid var(--border2);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;outline:0}
.editbox select:focus,.editbox textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;z-index:60;background:rgba(15,23,42,.4);overflow:auto;padding:44px 16px}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:16px;width:min(470px,96vw);padding:22px 24px;box-shadow:0 24px 60px rgba(15,23,42,.28)}
.mcard h3{margin:0 0 4px;font-size:17px;font-weight:700}.mcard .mh{color:var(--sub);font-size:12.5px;margin-bottom:14px}
.mrow{margin-bottom:11px}.mrow label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:500}
.mrow input,.mrow select,.mrow textarea{width:100%;border:1px solid var(--border2);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;outline:0}
.mrow input:focus,.mrow select:focus,.mrow textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.mact{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.foot{color:var(--mut);font-size:11.5px;margin-top:22px}
@media(max-width:1080px){.side{width:64px}.brand .nm,.nav button span,.side-foot .txt{display:none}.brand{justify-content:center}.grid3{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}.funnel{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.board{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="lg">GC</div><div class="nm">Global Care<span>Implantações · CASSI</span></div></div>

      <button data-v="dash" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>

        <button class="btn ghost" onclick="baixarWord()" title="Relatório em Word"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Word</button>
        <button class="btn ghost" onclick="baixarExcel()" title="Dados em Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Excel</button>
        <span id="addwrap"></span>
      </div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
    <div class="foot" id="ft"></div>
  </main>
</div>
<div class="ov" id="ov" onclick="close_()"></div>
<div class="dr" id="dr"></div>
<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>

// Motivo mapeado por TIPO de encerramento. Declinado = decisão NOSSA; Suspenso/Cancelado = da OPERADORA.
function motivoCat(d){
  const t=(d.motivo||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(d.desfecho==="Declinado"){                       // NÓS não atendemos
    if(/rentab|lucro|ll |margem|valor|prejuiz|inviav|tabela|reajuste/.test(t))return"Rentabilidade / valor";
    if(/perfil|fora de|nao atend|complexidade|nao contempl|alto custo|alta complex/.test(t))return"Fora do perfil / complexidade";
    if(/equipe|profission|cuidador|tecnic|logist|distanc|\barea\b|cobertura|sem vaga/.test(t))return"Sem equipe / logística";
    return t?"Outro (nós)":"Não informado";
  }
  // Suspenso/Cancelado — decisão/motivo da OPERADORA
  if(/obito|falec|evoluiu a obito/.test(t))return"Óbito";
  if(/redirec|direcionad|clinicassi|programa de ip|intervencao programada|modalidade de ip|foi para ip|seguiu para ip|internacao particular/.test(t))return"Redirecionado p/ IP";
  if(/sem previs|aguardando alta|sem alta|nao teve alta|condicoes de alta|sem condicoes/.test(t))return"Sem previsão de alta";
  if(/reintern|piora|internacao hospit|voltou ao hospital|hospitaliz/.test(t))return"Reinternação / piora";
  if(/desist|recus|familia nao|a pedido da familia|nao concord/.test(t))return"Desistência da família";
  if(/suspend|cancel|encerr|nao seguir/.test(t))return"Cancelado pela operadora";
  return t?"Outro (operadora)":"Não informado";
}
function cm(m){m=(m||"").toLowerCase();if(!m)return"Não informado";if(m.includes("clinicassi")||m.includes("programa de ip")||m.includes("redirec"))return"Redirecionado";if(m.includes("reintern")||m.includes("piora")||m.includes("obito")||m.includes("óbito"))return"Piora clínica";if(m.includes("sem previs")||m.includes("alta"))return"Sem previsão de alta";if(m.includes("suspend")||m.includes("cancel"))return"Cancelado operadora";if(m.includes("te ")||m.includes("cuidador")||m.includes("enfermagem"))return"Pendência equipe/TE";return"Outros";}

   <div style="margin-top:8px"><span class="badge" style="color:${DC[d.desfecho]};background:${DBG[d.desfecho]}"><span class="d" style="width:7px;height:7px;border-radius:50%;background:${DC[d.desfecho]}"></span>${label(d)}</span> <span style="color:var(--sub);font-size:12.5px">${esc(etapa(d))}</span></div></div>
   <div class="db"><div class="tl">${steps}</div><div class="kv">${kv.map(x=>`<div class="k">${x[0]}</div><div>${x[1]}</div>`).join("")}</div>
   ${(d.ult_assunto||d.ult_trecho)?`<div style="margin-top:14px;background:#F8FAFC;border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:9px;padding:11px 13px">
     <div style="font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">📩 Última situação${d.ult_de?` · de <b>${esc(d.ult_de)}</b>`:''}</div>
     ${d.ult_assunto?`<div style="font-weight:600;font-size:12.5px;margin-bottom:3px">${esc(d.ult_assunto)}</div>`:''}
     <div style="font-size:12px;color:var(--sub);line-height:1.4">${esc(d.ult_trecho)}</div></div>`:''}
   ${d.motivo?`<div class="note"><b>Motivo:</b> ${esc(d.motivo)}</div>`:''}
   <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${d.link?`<button class="btn" onclick="window.open('${d.link}','_blank')">Abrir e-mail (responder FUP)</button>`:''}<button class="btn ghost" onclick="sugerirFUP(${i})">Sugerir texto de FUP</button></div><div id="fupbox" style="display:none;margin-top:10px"></div>
   ${edit}</div>`;
  el("dr").classList.add("open");el("ov").classList.add("open");}
function close_(){el("dr").classList.remove("open");el("ov").classList.remove("open");}
function fupText(d){const nm=(d.paciente||"").trim(),op=d.operadora||"CASSI",prot=d.protocolo?(" (protocolo "+d.protocolo+")"):"";
  if(d.resposta&&!d.autorizacao)return `Prezados, bom dia.\n\nRetomando o caso de ${nm}${prot}: já encaminhamos avaliação + orçamento + NEAD em ${fmt(d.resposta)}. Seguimos no aguardo da autorização da ${op} para darmos andamento à desospitalização/implantação.\n\nFicamos à disposição.\nGrupo Global Care`;
  if(d.autorizacao&&!d.admissao)return `Prezados, bom dia.\n\nSobre o paciente ${nm}${prot}, autorizado em ${fmt(d.autorizacao)}: estamos alinhando a desospitalização/implantação. Poderiam confirmar a data prevista de alta para programarmos o atendimento?\n\nAtenciosamente,\nGrupo Global Care`;
  if(!d.resposta&&d.captacao)return `Prezados, bom dia.\n\nRecebemos a demanda de ${nm}${prot} e estamos finalizando avaliação + orçamento + NEAD, que enviaremos na sequência.\n\nAtenciosamente,\nGrupo Global Care`;
  return `Prezados, bom dia.\n\nSeguimos acompanhando o caso de ${nm}${prot}. Permanecemos à disposição para qualquer alinhamento.\n\nAtenciosamente,\nGrupo Global Care`;}
function sugerirFUP(i){const d=DATA[i],box=el("fupbox");if(!box)return;box.style.display="block";
  box.innerHTML=`<div style="font-size:12px;color:var(--sub);margin-bottom:4px">Texto sugerido — revise antes de enviar:</div><textarea id="fuptxt" rows="6" style="width:100%;border:1px solid var(--border2);border-radius:9px;padding:9px;font:inherit;font-size:12.5px">${esc(fupText(d))}</textarea><div style="margin-top:6px"><button class="btn ghost" onclick="copiarFUP()">Copiar texto</button></div>`;}
function copiarFUP(){const t=el("fuptxt");if(!t)return;t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand("copy");}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){close_();fecharModal();}});

async function api(url,body){ if(!sbc||!sess){alert("Para editar, abra a aba pela Central Comercial (logada).");return false;}
  try{ if(url==="/api/status"){ const set={}; if(body.desfecho)set.desfecho=body.desfecho; if(body.cancel_por)set.cancel_por=body.cancel_por; if(body.motivo!=null)set.motivo=body.motivo; if(body.unidade)set.unidade=body.unidade; if(typeof body.col==="number")set.col=body.col; else set.col=null;
      const {error}=await sbc.from("cassi_manual").upsert({id:"ov_"+body.chave, data:{chave:body.chave,set}, updated_at:new Date().toISOString()}); return !error; }
    if(url==="/api/novo"){ const c=body.campos||{}; const nome=(c.paciente||"").trim(); const k="N:"+normNome(nome);
      const campos={paciente:nome,operadora:c.operadora||"CASSI",unidade:c.unidade||"A confirmar",desfecho:c.desfecho||"Em andamento",captacao:c.dt_captacao||"",hospital:c.hospital||"",motivo:c.motivo_declinio||"",cancel_por:c.cancel_por||"",origem:"Manual",chave:k}; if(typeof c.col==="number")campos.col=c.col;
      const {error}=await sbc.from("cassi_manual").upsert({id:"nv_"+k, data:{novo:true,campos}, updated_at:new Date().toISOString()}); return !error; }
    if(url==="/api/arquivar"){ const {error}=await sbc.from("cassi_manual").upsert({id:"arq_"+body.chave, data:{chave:body.chave,acao:"arquivar"}, updated_at:new Date().toISOString()}); return !error; }
  }catch(e){return false;} return false; }
async function salvarStatus(ce){const chave=decodeURIComponent(ce);
  const v=el("edSit").value; let col=null, desf="";
  if(v!=="auto" && v[0]==="c"){col=parseInt(v.slice(1),10); desf=COL2DESF[col]||"";}
  const ok=await api("/api/status",{chave,desfecho:desf,col:col,motivo:el("edObs").value,unidade:el("edUni")?el("edUni").value:""});
  if(ok)location.reload();else alert("Não consegui salvar. Abra pelo atalho “Abrir Painel”.");}
async function arquivarCaso(ce){const chave=decodeURIComponent(ce);
  if(!confirm("Cancelar/remover este paciente do quadro?\n\nUse para registro DUPLICADO ou cancelado. Ele sai do quadro (a base de e-mail NÃO é apagada; dá para reverter).")) return;
  const ok=await api("/api/arquivar",{chave});
  if(ok)location.reload();else alert("Não consegui remover. Abra a aba pela Central (logada).");}
function modalNovo(){const un=(META.unidades||["A confirmar"]);
  el("mcard").innerHTML=`<h3>Incluir paciente</h3><div class="mh">Registro manual — sempre prevalece sobre o e-mail.</div>
   <div class="mrow"><label>Paciente *</label><input id="nvNome" placeholder="Nome completo"></div>
   <div class="mrow"><label>Operadora</label><input id="nvOp" value="CASSI"></div>
   <div class="mrow"><label>Unidade</label><select id="nvUni">${un.map(u=>`<option>${esc(u)}</option>`).join("")}</select></div>
   <div class="mrow"><label>Situação</label><select id="nvSit">${SITS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></div>
   <div class="mrow"><label>Data da demanda (envio da operadora)</label><input id="nvCap" type="date"></div>
   <div class="mrow"><label>Hospital / origem</label><input id="nvHosp"></div>
   <div class="mrow"><label>Observação</label><textarea id="nvObs" rows="2"></textarea></div>
   <div class="mact"><button class="btn ghost" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="salvarNovo()">Incluir</button></div>`;
  el("modal").classList.add("open");}
function fecharModal(){el("modal").classList.remove("open");}
async function salvarNovo(){const nome=el("nvNome").value.trim();if(!nome){alert("Informe o nome do paciente.");return;}
  const sv=el("nvSit").value; let col=null, desf="Em andamento";
  if(sv!=="auto" && sv[0]==="c"){col=parseInt(sv.slice(1),10); desf=COL2DESF[col]||"Em andamento";}
  const campos={paciente:nome,operadora:el("nvOp").value.trim()||"CASSI",unidade:el("nvUni").value,desfecho:desf,col:col,
   dt_captacao:el("nvCap").value,hospital:el("nvHosp").value.trim(),motivo_declinio:el("nvObs").value.trim()};
  const ok=await api("/api/novo",{campos});if(ok)location.reload();else alert("Não consegui incluir. Abra pelo atalho “Abrir Painel”.");}

(async()=>{ const live=await carregarSB(); if(live){DATA=live; META.editavel=true;} pill(); init(); render();
  ["fOper","fUni"].forEach(id=>el(id).onchange=render); el("fB").oninput=render; })();
setInterval(async()=>{ if(sbc&&sess){ const live=await carregarSB(); if(live){DATA=live; render();} } },60000);
</script></body></html>
